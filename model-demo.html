<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Godfield-lite Model Demo</title>
  <!-- Standalone from src/style.css on purpose: that file now only styles
       the Phaser canvas container for index.html (see src/scenes/), and this
       page is a plain DOM page independent of the UI (see README.md). -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #1e2230;
      color: #e8eaf0;
    }
    .app { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { text-align: center; margin-bottom: 4px; }
    .subtitle { text-align: center; margin-top: 0; opacity: 0.7; font-size: 0.9rem; }
    #results { list-style: none; padding: 0; font-family: monospace; }
    #results .pass { color: #7fd18a; }
    #results .fail { color: #ff8080; }
    #summary { font-weight: 700; margin: 12px 0; }
  </style>
</head>
<body>
  <main class="app">
    <h1>Data Model Smoke Test</h1>
    <p class="subtitle">
      Standalone check for the class / synergy / card data model in
      <code>src/model/</code> (see docs/DESIGN.md), independent of any UI.
      For the actual playable game built on this model, see
      <code>index.html</code>; <code>src/model/engine.js</code> is the turn
      loop that wires the two together.
    </p>
    <p id="summary"></p>
    <ul id="results"></ul>
  </main>

  <script type="module" src="/src/model/demo.ts"></script>
</body>
</html>
